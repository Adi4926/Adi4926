<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.3); }
    }
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
      transform-origin: 56px 45px;
    }
  </style>

  <!-- Background Base & Glowing Border -->
  <rect width="800" height="220" rx="16" fill="url(#card-bg)" />
  <rect width="800" height="220" rx="16" stroke="url(#border-grad)" stroke-width="2" />

  <!-- Viewfinder Aesthetic Corner Marks -->
  <path d="M 720 36 L 756 36 L 756 72" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 756 148 L 756 184 L 720 184" stroke="#f472b6" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
  <text x="696" y="52" font-family="monospace" font-size="11" fill="#38bdf8" opacity="0.8">REC ●</text>
  <text x="630" y="178" font-family="monospace" font-size="11" fill="#64748b">PORTFOLIO v2.0</text>

  <!-- Status Pill Badge -->
  <rect x="40" y="32" width="170" height="26" rx="13" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.35" stroke-width="1" />
  <circle cx="56" cy="45" r="4" fill="#10b981" class="pulse-dot" />
  <text x="68" y="49" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#10b981" letter-spacing="1.5">OPEN TO COLLABS</text>

  <!-- Name -->
  <text x="40" y="105" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#name-grad)">Hi, I'm Aditya Verma</text>

  <!-- Subtitle Role -->
  <text x="40" y="140" font-family="monospace, -apple-system" font-size="15" fill="#94a3b8">
    <tspan fill="#38bdf8" font-weight="bold">> </tspan>Full-Stack Web Developer & Builder
  </text>

  <!-- Details Row -->
  <text x="40" y="175" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#64748b">Lucknow, India   •   Crafting fast, responsive web experiences</text>
</svg>
